<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Entrar | meu.painel</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Supabase por CDN e depois a autenticação compartilhada -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/auth.js"></script>

  <style>
    /* ===== Design system ===== */
    :root {
      --coral: #D4572A;
      --coral-escuro: #B8461F;
      --creme: #F5F3EF;
      --branco: #FFFFFF;
      --grafite: #1A1816;
      --texto-suave: #6B645C;
      --borda: #DDD8D0;
      --verde: #2D7A4F;
      --vermelho: #C4453C;

      --fonte-titulo: 'Fraunces', Georgia, serif;
      --fonte-texto: 'Outfit', system-ui, -apple-system, sans-serif;

      --raio-p: 12px;
      --raio-m: 16px;
      --raio-g: 24px;
      --sombra: 0 1px 2px rgba(26, 24, 22, .04), 0 12px 32px rgba(26, 24, 22, .07);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: var(--creme);
      color: var(--grafite);
      font-family: var(--fonte-texto);
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .cartao {
      width: 100%;
      max-width: 420px;
      background: var(--branco);
      border: 1px solid var(--borda);
      border-radius: var(--raio-g);
      box-shadow: var(--sombra);
      padding: 40px 32px 32px;
    }

    .logo {
      font-family: var(--fonte-titulo);
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -.01em;
      margin-bottom: 28px;
    }
    .logo span { color: var(--coral); }

    h1 {
      font-family: var(--fonte-titulo);
      font-size: 30px;
      font-weight: 500;
      letter-spacing: -.02em;
      line-height: 1.15;
      margin-bottom: 8px;
    }
    .subtitulo { color: var(--texto-suave); margin-bottom: 28px; }

    /* Faixas de mensagem */
    .faixa {
      display: none;
      border-radius: var(--raio-p);
      padding: 12px 14px;
      margin-bottom: 18px;
      font-size: 14px;
    }
    .faixa.visivel { display: block; }
    .faixa.erro { background: #FBECEA; color: var(--vermelho); border: 1px solid #F0CBC7; }
    .faixa.sucesso { background: #E8F3EC; color: var(--verde); border: 1px solid #C5E0CF; }

    form { display: flex; flex-direction: column; gap: 16px; }
    form[hidden] { display: none; }

    label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }

    input {
      width: 100%;
      font: inherit;
      color: var(--grafite);
      background: var(--creme);
      border: 1px solid var(--borda);
      border-radius: var(--raio-p);
      padding: 12px 14px;
      transition: border-color .15s, box-shadow .15s, background .15s;
    }
    input:focus {
      outline: none;
      background: var(--branco);
      border-color: var(--coral);
      box-shadow: 0 0 0 4px rgba(212, 87, 42, .14);
    }

    .linha-link { display: flex; justify-content: flex-end; margin-top: -6px; }

    .link {
      background: none;
      border: none;
      font: inherit;
      font-size: 14px;
      color: var(--coral);
      cursor: pointer;
      padding: 0;
    }
    .link:hover { color: var(--coral-escuro); text-decoration: underline; }

    .botao {
      font: inherit;
      font-weight: 600;
      color: var(--branco);
      background: var(--coral);
      border: none;
      border-radius: var(--raio-p);
      padding: 13px 18px;
      cursor: pointer;
      transition: background .15s, transform .05s;
    }
    .botao:hover { background: var(--coral-escuro); }
    .botao:active { transform: translateY(1px); }
    .botao:disabled { opacity: .7; cursor: wait; }

    .texto-apoio { font-size: 14px; color: var(--texto-suave); }

    .voltar { text-align: center; margin-top: 4px; }

    @media (max-width: 420px) {
      .cartao { padding: 32px 22px 24px; border-radius: 20px; }
      h1 { font-size: 26px; }
    }
  </style>
</head>
<body>
  <main class="cartao">
    <div class="logo">meu<span>.</span>painel</div>

    <h1 id="titulo">Acesso restrito</h1>
    <p class="subtitulo" id="subtitulo">Faça login para ver os números do seu portfólio.</p>

    <div class="faixa erro" id="faixa-erro" role="alert"></div>
    <div class="faixa sucesso" id="faixa-sucesso" role="status"></div>

    <!-- Formulário de login -->
    <form id="form-login" novalidate>
      <div>
        <label for="email">E-mail</label>
        <input type="email" id="email" autocomplete="email" required>
      </div>
      <div>
        <label for="senha">Senha</label>
        <input type="password" id="senha" autocomplete="current-password" required>
      </div>
      <div class="linha-link">
        <button type="button" class="link" id="link-esqueci">Esqueci minha senha</button>
      </div>
      <button type="submit" class="botao" id="botao-entrar">Entrar</button>
    </form>

    <!-- Formulário de recuperação -->
    <form id="form-recuperar" novalidate hidden>
      <p class="texto-apoio">Informe seu e-mail e enviaremos um link para criar uma nova senha.</p>
      <div>
        <label for="email-recuperar">E-mail</label>
        <input type="email" id="email-recuperar" autocomplete="email" required>
      </div>
      <button type="submit" class="botao" id="botao-recuperar">Enviar link</button>
      <div class="voltar">
        <button type="button" class="link" id="link-voltar">Voltar para o login</button>
      </div>
    </form>

    <!-- Formulário de nova senha (aberto pelo link do e-mail de recuperação) -->
    <form id="form-nova-senha" novalidate hidden>
      <div>
        <label for="nova-senha">Nova senha</label>
        <input type="password" id="nova-senha" autocomplete="new-password" minlength="6" required>
      </div>
      <button type="submit" class="botao" id="botao-nova-senha">Salvar nova senha</button>
    </form>
  </main>

  <script>
    (function () {
      const $ = (id) => document.getElementById(id);
      const formLogin = $('form-login');
      const formRecuperar = $('form-recuperar');
      const formNovaSenha = $('form-nova-senha');

      function mostrarErro(msg) {
        $('faixa-sucesso').classList.remove('visivel');
        $('faixa-erro').textContent = msg;
        $('faixa-erro').classList.add('visivel');
      }
      function mostrarSucesso(msg) {
        $('faixa-erro').classList.remove('visivel');
        $('faixa-sucesso').textContent = msg;
        $('faixa-sucesso').classList.add('visivel');
      }
      function limparFaixas() {
        $('faixa-erro').classList.remove('visivel');
        $('faixa-sucesso').classList.remove('visivel');
      }

      // Alterna qual formulário aparece e ajusta o título.
      function trocarTela(tela) {
        limparFaixas();
        formLogin.hidden = tela !== 'login';
        formRecuperar.hidden = tela !== 'recuperar';
        formNovaSenha.hidden = tela !== 'nova-senha';
        const textos = {
          'login': ['Acesso restrito', 'Faça login para ver os números do seu portfólio.'],
          'recuperar': ['Recuperar senha', 'Sem problema, acontece com todo mundo.'],
          'nova-senha': ['Crie uma nova senha', 'Escolha uma senha com pelo menos 6 caracteres.'],
        };
        $('titulo').textContent = textos[tela][0];
        $('subtitulo').textContent = textos[tela][1];
      }

      function carregando(botao, ativo, textoCarregando) {
        if (ativo) {
          botao.dataset.textoOriginal = botao.textContent;
          botao.textContent = textoCarregando;
          botao.disabled = true;
        } else {
          botao.textContent = botao.dataset.textoOriginal || botao.textContent;
          botao.disabled = false;
        }
      }

      if (!window.Auth) {
        mostrarErro('Não foi possível carregar o sistema de login. Verifique sua conexão e recarregue a página.');
        return;
      }

      // Chegou pelo link de recuperação? Mostra o formulário de nova senha
      // em vez de redirecionar para o painel.
      const hash = window.location.hash || '';
      const veioDaRecuperacao = hash.includes('type=recovery');
      if (hash.includes('error_description')) {
        mostrarErro('O link expirou ou já foi usado. Peça um novo em "Esqueci minha senha".');
      }

      if (veioDaRecuperacao) {
        trocarTela('nova-senha');
      } else {
        // Já logado? Vai direto para o painel.
        Auth.sessaoAtual().then((sessao) => {
          if (sessao) window.location.replace('painel.html');
        }).catch(() => {});
      }

      Auth.sb.auth.onAuthStateChange((evento) => {
        if (evento === 'PASSWORD_RECOVERY') trocarTela('nova-senha');
      });

      // ===== Login =====
      formLogin.addEventListener('submit', async (e) => {
        e.preventDefault();
        limparFaixas();
        const email = $('email').value.trim();
        const senha = $('senha').value;
        if (!email || !senha) {
          mostrarErro('Preencha e-mail e senha.');
          return;
        }
        const botao = $('botao-entrar');
        carregando(botao, true, 'Entrando...');
        try {
          await Auth.login(email, senha);
          window.location.replace('painel.html');
        } catch (erro) {
          mostrarErro(erro.message);
          carregando(botao, false);
        }
      });

      // ===== Esqueci minha senha =====
      $('link-esqueci').addEventListener('click', () => {
        $('email-recuperar').value = $('email').value.trim();
        trocarTela('recuperar');
        $('email-recuperar').focus();
      });
      $('link-voltar').addEventListener('click', () => trocarTela('login'));

      formRecuperar.addEventListener('submit', async (e) => {
        e.preventDefault();
        limparFaixas();
        const email = $('email-recuperar').value.trim();
        if (!email) {
          mostrarErro('Informe seu e-mail.');
          return;
        }
        const botao = $('botao-recuperar');
        carregando(botao, true, 'Enviando...');
        try {
          await Auth.recuperarSenha(email);
          mostrarSucesso('Pronto! Se esse e-mail estiver cadastrado, você vai receber um link para criar uma nova senha.');
        } catch (erro) {
          mostrarErro(erro.message);
        } finally {
          carregando(botao, false);
        }
      });

      // ===== Nova senha =====
      formNovaSenha.addEventListener('submit', async (e) => {
        e.preventDefault();
        limparFaixas();
        const senha = $('nova-senha').value;
        if (senha.length < 6) {
          mostrarErro('A senha precisa ter pelo menos 6 caracteres.');
          return;
        }
        const botao = $('botao-nova-senha');
        carregando(botao, true, 'Salvando...');
        try {
          await Auth.atualizarSenha(senha);
          mostrarSucesso('Senha atualizada! Abrindo o painel...');
          setTimeout(() => window.location.replace('painel.html'), 1200);
        } catch (erro) {
          mostrarErro(erro.message);
          carregando(botao, false);
        }
      });
    })();
  </script>
</body>
</html>
